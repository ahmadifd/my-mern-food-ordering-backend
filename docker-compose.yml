version: "3.8"
services:
  web:
    image: fdahmadi/web:6
    command: sh -c "npm i && npm run dev"
    ports:
      - 1000:1000
    environment:
      VITE_APP_URL: https://localhost:1000
      VITE_API_BASE_URL: https://localhost:1001
    networks:
      - app-network

  api:
    image: fdahmadi/api:7
    command: sh -c "npm i && npm run dev"
    ports:
      - 1001:1001
    environment:
      ACCESS_TOKEN_PRIVATE_KEY: sdfjhj234t2fwd0982i34rf23feoijf042SDF
      REFRESH_TOKEN_PRIVATE_KEY: sdfjhj432t2fwd0982i43rf23feoijf024SDF
      PORT: 1001
      VITE_API_BASE_URL: https://localhost:1001
      RETURN_URL: https://localhost:1000
      CONNECTION_STRING: mongodb://root:123@db
    volumes:
      - mymernfoodorderingpics:/app/public/uploads
    networks:
      - app-network
  db:
    image: mongo
    restart: always
    ports:
      - 1002:27017
    volumes:
      - mymernfoodorderingdb:/data/db
    networks:
      - app-network
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: root
    #   MONGO_INITDB_ROOT_PASSWORD: 123
    command: [--auth]
volumes:
  mymernfoodorderingdb:
  mymernfoodorderingpics:
networks:
  app-network:
    driver: bridge
